# Tests, builds the browser version and deploys it to tennis.umolab.ru on every push to master.
#
# Repository secrets:
#   UNITY_EMAIL, UNITY_PASSWORD   the Unity account the editor is licensed to (Personal licence)
#   UNITY_LICENSE                 optional: contents of a Unity_lic.ulf file, if you activate that way
#   DEPLOY_SSH_KEY                private key allowed on the server only to rrsync into the site folder
#   DEPLOY_KNOWN_HOSTS            output of: ssh-keyscan fp.cloud28.umolab.ru
#   DEPLOY_HOST                   user1@fp.cloud28.umolab.ru
# See docs/CI.md for how they are made.
name: Web build and deploy

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.6.7f1

jobs:
  # Until the secrets are set, the pipeline says so and skips the rest instead of failing.
  check:
    name: Check secrets
    runs-on: ubuntu-latest
    outputs:
      unity: ${{ steps.check.outputs.unity }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$UNITY_EMAIL" ] || [ -n "$UNITY_LICENSE" ]; then echo "unity=true" >> "$GITHUB_OUTPUT"; else echo "::warning::No Unity licence secrets: build skipped. See docs/CI.md"; fi
          if [ -n "$DEPLOY_SSH_KEY" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "::warning::No DEPLOY_SSH_KEY: deploy skipped. See docs/CI.md"; fi

  test:
    name: Tests (EditMode)
    needs: check
    if: needs.check.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

  build:
    name: WebGL build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The Unity WebGL image is large; the runner needs the room.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-webgl-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: Library-webgl-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: TennisSim.EditorTools.ProjectBuilder.BuildWebGL

      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: Build/WebGL
          retention-days: 7

  deploy:
    name: Deploy to tennis.umolab.ru
    needs: [check, build]
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tennis.umolab.ru
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webgl
          path: Build/WebGL

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The key is limited to rrsync in the site folder, so the remote path is relative to it: empty.
      - name: Upload
        env:
          SSH_OPTS: -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes
        run: bash Tools/CI/deploy-web.sh Build/WebGL "${{ secrets.DEPLOY_HOST }}" ""

      - name: Check the site answers
        run: curl --fail --silent --show-error --max-time 30 -o /dev/null https://tennis.umolab.ru/
