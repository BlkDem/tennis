<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1620; color: #e8eef2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #0b1620; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0b1620; }
    #title { font-size: clamp(28px, 6vw, 56px); font-weight: 800; letter-spacing: 2px; color: #f8cc38; }
    #bar { width: min(440px, 72vw); height: 10px; border-radius: 5px; overflow: hidden; background: #1d2c38; }
    #fill { width: 0; height: 100%; background: #2fae6b; transition: width 0.2s; }
    #note { max-width: 80vw; font-size: 15px; line-height: 1.5; text-align: center; color: #9aaab5; }
    #note b { color: #e8eef2; }
    .error { color: #ff7b6b; }
    #windows { position: fixed; right: 12px; bottom: 10px; z-index: 10; padding: 6px 12px; border-radius: 6px; background: rgba(11, 22, 32, 0.7); color: #f8cc38; font-size: 14px; text-decoration: none; }
    #windows:hover { background: rgba(11, 22, 32, 0.95); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <a id="windows" href="/download/" target="_blank" rel="noopener">Скачать для Windows</a>
  <div id="loader">
    <div id="title">TENNIS SIMULATOR</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="note">
      Загрузка игры…<br>
      Играть с <b>клавиатуры</b> или <b>геймпада</b> (нажмите любую кнопку на геймпаде, чтобы браузер его увидел).<br>
      Нужен компьютер: на телефонах игра не запускается.
    </div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var note = document.querySelector("#note");
    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Sharp enough on high-density screens without rendering several times the pixels.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: function (message, type) {
        if (type === "error") note.innerHTML = '<span class="error">' + message + "</span>";
        else console.log(message);
      },
    };

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loader").remove();
        canvas.focus();
      }).catch(function (message) {
        config.showBanner("Не удалось запустить игру: " + message, "error");
      });
    };
    document.body.appendChild(script);
    // Keyboard input goes to the game once the page is clicked.
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
